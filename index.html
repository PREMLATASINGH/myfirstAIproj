<!DOCTYPE html>
<html>
<head>
  <title>My Test Chatbot</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    #chat { width: 100%; max-width: 600px; margin: auto; }
    .bubble { padding: 10px; margin: 10px 0; border-radius: 8px; }
    .user { background: #d1e7ff; text-align: right; }
    .bot { background: #e8e8e8; text-align: left; }
  </style>
</head>
<body>

<div id="chat">
  <h2>My Test Chatbot</h2>
  <div id="messages"></div>

  <input id="input" type="text" placeholder="Type your message..." style="width:80%; padding:10px;">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
const API_KEY = "AIzaSyD1kmCLm-S9-a92C-yiKCy4MIdiVDs10YM";
const URL = "https://generativelanguage.googleapis.com/v1beta/models/gemma-3-4b-it:generateContent?key=" + API_KEY;

function addMessage(text, sender) {
  const msg = document.createElement("div");
  msg.className = "bubble " + sender;
  msg.innerText = text;
  document.getElementById("messages").appendChild(msg);
}

async function sendMessage() {
  const input = document.getElementById("input");
  const userText = input.value.trim();
  if (!userText) return;

  addMessage(userText, "user");
  input.value = "";

  const body = {
    contents: [
      {
        parts: [{ text: userText }]
      }
    ]
  };

  try {
    const res = await fetch(URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response";

    addMessage(botReply, "bot");

  } catch (err) {
    addMessage("Error: " + err.message, "bot");
  }
}
</script>

</body>

</html>
